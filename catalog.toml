# The candidate indicators (SPEC.md §4.3). spylead reads this file at startup and keeps its order.
# name: [A-Za-z0-9_]{1,40}, unique. fred_id: the FRED series ID.
# form: LOG fits ln(value); LEVEL fits the value itself, for series that can be zero or negative (§5.4).
# default_lag_days: days from the FRED date to the first release, used when recent releases are too few
# to measure the lag (§5.2).

[[series]]
name = "M2"
fred_id = "M2SL"
form = "LOG"
default_lag_days = 55
